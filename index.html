<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Match Sub Planner</title>
<style>
body{margin:0;background:#0b1220;color:#e6edf7;font:14px system-ui,Arial;padding:10px}
h2{font-size:12px;color:#93a4bf;margin:0 0 8px;letter-spacing:.5px}
button{background:#1e2b45;color:#e6edf7;border:1px solid #26344b;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
button.go{background:#22c55e;color:#05230f;font-weight:700;border-color:#15803d}
button.big{padding:11px 18px;font-size:15px;border-radius:10px;width:100%;text-align:left}
input,select,textarea{background:#0e1728;color:#e6edf7;border:1px solid #26344b;border-radius:6px;font:inherit;padding:4px}
textarea{width:100%;height:74px;font:12px monospace}
.bar{font-size:11px;color:#86d7a6;margin:6px 0}
.bar.e{color:#fca5a5}
.tabs{margin:8px 0}
.tabs button{margin-right:5px}
.tabs button.on{background:#182338;box-shadow:inset 0 2px 0 #22c55e}
.pg{display:none}.pg.on{display:block}
.box{background:#131c2e;border:1px solid #26344b;border-radius:10px;padding:11px;margin-bottom:10px}
.cfg{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:11px;color:#93a4bf;text-transform:uppercase;letter-spacing:.4px}
.cfg label{display:flex;gap:5px;align-items:center}
.cfg select{text-transform:none;letter-spacing:0;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:3px;border-bottom:1px solid #1d2a40;text-align:left}
.cell{width:100%;background:#0e1728;border:1px solid transparent;border-radius:6px;color:#e6edf7;font:inherit;padding:3px}
.bb{height:12px;background:#0d1626;border:1px solid #26344b;border-radius:6px;overflow:hidden;margin-top:9px}
.bf{height:100%;width:0;background:#22c55e}
.bf.un{background:#f59e0b}.bf.ov{background:#ef4444}
.pitch{position:relative;height:68vh;aspect-ratio:68/105;margin:0 auto;font-size:clamp(9px,1.35vh,15px);
background:repeating-linear-gradient(180deg,#1c7a45 0 10%,#186b3c 10% 20%);border:2px solid #8fb9a3;border-radius:10px;touch-action:none}
.sl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:7em}
.sl b{font-size:.85em;background:rgba(0,0,0,.5);border-radius:4px;padding:0 4px}
.sl i{font-size:.9em;font-style:normal;background:rgba(0,0,0,.5);padding:0 4px;border-radius:5px;white-space:nowrap;max-width:7em;overflow:hidden}
.sl u{font-size:.78em;text-decoration:none;background:rgba(0,0,0,.4);border-radius:4px;padding:0 4px}
.sl u.over{color:#ffb4b4}.sl u.under{color:#ffe08a}
.tk{width:3.2em;height:3.2em;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.15em;color:#07131f;border:2px solid #fff;cursor:grab;touch-action:none}
.GK{background:#facc15}.D{background:#38bdf8}.M{background:#34d399}.A{background:#fb7185}
.em{width:3.2em;height:3.2em;border-radius:50%;border:2px dashed #7f9d8c;display:grid;place-items:center}
.sl.ov{background:rgba(56,189,248,.25);border-radius:10px;outline:2px dashed #7dd3fc}
.bk{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.bk button{flex:1;min-width:48px;font-size:12px}
.bk button.on{background:#1f7a45}
.bn{display:flex;flex-wrap:wrap;gap:6px;border:2px dashed #33456a;border-radius:10px;padding:8px;margin-top:8px;min-height:56px}
.bn.ov{border-color:#22c55e}
.bt{background:#1b2740;border:1px solid #33456a;border-radius:8px;padding:4px 8px;cursor:grab;touch-action:none;font-size:12px}
.gh{position:fixed;transform:translate(-50%,-50%);background:#28d16a;color:#04240f;font-weight:700;border-radius:16px;padding:5px 10px;font-size:12px;pointer-events:none;z-index:99}
.sbp{font-size:12px;color:#8ef0b4}
.sbo{font-size:12px;color:#ffb4b4}
.fr{font-size:.78em;color:#07131f;border-radius:4px;padding:0 5px;font-weight:700;white-space:nowrap;max-width:9em;overflow:hidden;text-overflow:ellipsis}
.shl{font-size:12px;color:#93a4bf;padding-left:12px}
.cr{border-left:3px solid #33456a;padding:5px 8px;margin-bottom:6px;font-size:12px}
.cr.on{border-left-color:#22c55e}
.ck{font-size:12px;color:#bae6fd}.ck div{padding:3px 0;border-bottom:1px dashed #22304a}
.ck .bad{color:#fca5a5}.ck .warn{color:#fde68a}
.xs{overflow-x:auto}
.pc{font-size:10px;font-weight:700;border-radius:5px;padding:1px 5px;background:#22314e}
.pc.b{background:#1b2740;color:#8494b3}
.prompt{background:#14283c;border:1px solid #2f5e86;border-radius:9px;padding:9px 11px;margin-top:9px;font-size:13px;color:#cfe6ff}
</style></head>
<body>
<div class="bar" id="bar">Loading</div>
<div class="tabs" id="tb">
<button data-p="sq" class="on">1 Squad</button><button data-p="pit">2 Pitch</button><button data-p="pl">3 Plan</button>
</div>
<div class="pg on" id="pg-sq">
  <div class="box">
    <h2>Match settings</h2>
    <div class="cfg" id="cfgRow"></div>
  </div>
  <div class="box">
    <h2>Paste your squad</h2>
    <textarea id="ap" placeholder="7, Ali Khan, GK/LB&#10;Jack, LB/LM, 40&#10;Tom, CM/RM, 35"></textarea>
    <div style="margin-top:6px"><button class="go" id="bImp">Import players</button> <button id="bAdd">+ Blank</button> <button id="bClr">Clear</button></div>
  </div>
  <div class="box" id="sqBox" style="display:none">
    <h2>Players &amp; minutes &mdash; positions in order of preference</h2>
    <table id="pT"><tbody></tbody></table>
    <div class="bb"><div class="bf" id="bF"></div></div>
    <div class="bar" id="bud"></div>
    <div class="prompt" id="prompt">Players look good? <b>Time to plan the match.</b></div>
    <button class="go big" id="bGo">&#9889; Auto plan, or plan manually &rarr;</button>
  </div>
</div>
<div class="pg" id="pg-pit">
  <div class="box">
    <div class="bk" id="bk"></div>
    <div class="pitch" id="pitch" style="margin-top:8px"></div>
    <div id="subs"></div>
    <div class="bn" id="bench"></div>
  </div>
</div>
<div class="pg" id="pg-pl">
  <div class="box"><h2>Timeline</h2><div id="tl"></div></div>
  <div class="box"><h2>Positions &amp; minutes</h2><div class="xs"><table id="posT"></table></div></div>
  <div class="box"><h2>Checks</h2><div class="ck" id="ck"></div></div>
</div>
<script>
var d=function(i){return document.getElementById(i)};
function bar(t,e){var b=d('bar');b.textContent=t;b.className=e?'bar e':'bar';}
var FM={GK:'GK',LB:'D',LCB:'D',CB:'D',RCB:'D',RB:'D',LWB:'D',RWB:'D',CDM:'M',CM:'M',CAM:'M',LM:'M',RM:'M',LW:'A',RW:'A',ST:'A'};
var AL={gk:'GK',goalkeeper:'GK',keeper:'GK',lb:'LB',leftback:'LB',cb:'CB',centreback:'CB',centerback:'CB',rb:'RB',rightback:'RB',cdm:'CDM',dm:'CDM',cm:'CM',centremid:'CM',midfield:'CM',mid:'CM',cam:'CAM',am:'CAM',attackingmid:'CAM',lm:'LM',leftmid:'LM',rm:'RM',rightmid:'RM',lw:'LW',leftwing:'LW',rw:'RW',rightwing:'RW',winger:'LW',st:'ST',cf:'ST',striker:'ST',forward:'ST',fw:'ST',attacker:'ST'};
var SHPS={
5:[['2-1-1','LB RB|CM|ST']],
6:[['2-2-1','LB RB|LM RM|ST'],['2-1-2','LB RB|CM|ST ST']],
7:[['2-3-1','LB RB|LM CM RM|ST'],['3-2-1','LB CB RB|CM CM|ST']],
8:[['3-2-2','LB CB RB|CM CM|ST ST'],['2-3-2','LB RB|LM CM RM|ST ST']],
9:[['3-4-1','LB CB RB|LM CM CM RM|ST'],['3-3-2','LB CB RB|LM CM RM|ST ST'],['3-2-3','LB CB RB|CM CM|LW ST RW']],
10:[['4-3-2','LB LCB RCB RB|LM CM RM|ST ST'],['3-3-3','LB CB RB|LM CM RM|LW ST RW']],
11:[['4-4-2','LB LCB RCB RB|LM CM CM RM|ST ST'],['4-3-3','LB LCB RCB RB|CM CM CM|LW ST RW'],['4-2-3-1','LB LCB RCB RB|CDM CDM|LM CAM RM|ST']]};
var OF={1:[0],2:[-16,16],3:[-30,0,30],4:[-42,-14,14,42],5:[-44,-22,0,22,44]};
var PW=[10,7.5,5.5,4,3,2.5,2];
var COLS=['#22c55e','#38bdf8','#f59e0b','#a78bfa','#f472b6','#a3e635'];
var S={side:9,form:0,per:4,mpp:20,sub:20,gk:false,players:[],snaps:[],aid:null,page:'sq'};
var uid=1,sel=null,drag=null,gh=null;
function cl(v,a,b){return Math.max(a,Math.min(b,v))}
function E(){return Math.max(4,S.per*S.mpp)}
function shapes(){return SHPS[S.side]||SHPS[9]}
function pp(s){
  var o=[];
  if(!s)return o;
  s.split(',').join(' ').split(';').join(' ').split('/').join(' ').split('|').join(' ').split(' ').forEach(function(w){
    var k=w.toLowerCase().replace(/[^a-z]/g,'');
    if(!k)return;
    var c=AL[k]||(FM[w.toUpperCase()]?w.toUpperCase():null);
    if(c&&o.indexOf(c)<0)o.push(c);
  });
  return o;
}
function FS(p,pos){
  if(!p.prefs.length)return 1.5;
  var i=p.prefs.indexOf(pos),b=0,k;
  if(i>=0)return PW[Math.min(i,PW.length-1)];
  for(k=0;k<p.prefs.length;k++)if(FM[p.prefs[k]]===FM[pos]){var w=PW[Math.min(k,PW.length-1)]*.45;if(w>b)b=w}
  return b>0?Math.min(4.5,b):.2;
}
function OOP(p,pos){
  if(!p.prefs.length)return false;
  if(p.prefs.indexOf(pos)>=0)return false;
  for(var k=0;k<p.prefs.length;k++)if(FM[p.prefs[k]]===FM[pos])return false;
  return true;
}
function PN(p,pos,l){
  if(!p.prefs.length)return 0;
  var u=l/20,i=p.prefs.indexOf(pos);
  if(i===0||i===1)return 0;
  if(i===2)return .8*u;
  if(i>=3)return 1.4*u;
  for(var k=0;k<p.prefs.length;k++)if(FM[p.prefs[k]]===FM[pos])return 1.8*u;
  return 7*u;
}
function SH(){
  var a=shapes()[cl(S.form,0,shapes().length-1)],rows=a[1].split('|'),o=[{p:'GK',x:50,y:92}],m=rows.length,i,j;
  for(i=0;i<m;i++){
    var q=rows[i].split(' '),f=OF[q.length]||[0],y=(m<2)?48:76-i*(56/(m-1));
    for(j=0;j<q.length;j++)o.push({p:q[j],x:cl(50+f[j],6,94),y:y});
  }
  return {n:a[0],s:o};
}
function ply(id){for(var i=0;i<S.players.length;i++)if(S.players[i].id===id)return S.players[i];return null}
function act(){for(var i=0;i<S.snaps.length;i++)if(S.snaps[i].id===S.aid)return S.snaps[i];return S.snaps[0]||null}
function srt(){return S.snaps.slice().sort(function(a,b){return a.t-b.t})}
function bl(){var out=[],ss=srt(),e=E();
  for(var i=0;i<ss.length;i++){var a=ss[i].t,b=(i+1<ss.length?ss[i+1].t:e);if(b>a&&a<e)out.push({sn:ss[i],t0:a,t1:b,len:b-a});}
  return out;
}
function blk(n){var a=[],i;for(i=0;i<n;i++)a.push(null);return a;}
function isA(p){return p.target==null||p.target===''}
function keep(){var p=S.players.filter(function(x){return x.prefs.indexOf('GK')>=0});if(S.gk&&p.length>1)return p.slice(0,2);return p.length?[p[0]]:(S.players.length?[S.players[0]]:[]);}
function am(){
  var F=SH(),e=E(),K=keep(),nk=K.length,m={},os=Math.max(0,F.s.length-1);
  var n=Math.max(1,S.players.length-nk),total=os*e;
  var base=cl(Math.floor(total/n/10)*10,0,e);
  var extra=Math.min(n,Math.max(0,Math.round((total-base*n)/10)));
  var cnt=0;
  S.players.forEach(function(p){
    if(K.indexOf(p)>=0)return;
    m[p.id]=cl((cnt<extra)?base+10:base,0,e);
    cnt++;
  });
  K.forEach(function(k){m[k.id]=cl((nk===1)?e:Math.round(e/nk),0,e)});
  return m;
}
function wnt(p){return isA(p)?(am()[p.id]||0):+p.target}
function calc(){
  var F=SH(),mn={},bp={};
  S.players.forEach(function(p){mn[p.id]=0;bp[p.id]={}});
  bl().forEach(function(v){F.s.forEach(function(sl,i){var id=v.sn.assign[i];if(!id||mn[id]===undefined)return;mn[id]+=v.len;bp[id][sl.p]=(bp[id][sl.p]||0)+v.len;})});
  return {mn:mn,bp:bp};
}
/* subs = players who come off the bench at this snapshot */
function subSets(pv,cur){
  var F=SH(),subs=[],shuf=[];
  if(!pv)return {subs:subs,shuf:shuf};
  F.s.forEach(function(sl,si){
    var x=pv.assign[si],y=cur.assign[si];
    if(x===y)return;
    var onBenchBefore=x?pv.assign.indexOf(x)<0:false;
    var yp=y?ply(y):null,xp=x?ply(x):null;
    if(yp&&pv.assign.indexOf(yp.id)<0)subs.push({inP:yp,outP:xp,pos:sl.p,si:si});
    else shuf.push({inP:yp,outP:xp,pos:sl.p,si:si});
  });
  return {subs:subs,shuf:shuf};
}
function planner(){
  var P=S.players,F=SH(),N=F.s.length,SO=Math.max(1,N-1),e=E();
  var K=keep(),kid=K.map(function(k){return k.id});
  var outs=P.filter(function(p){return kid.indexOf(p.id)<0}).map(function(p){return p.id});
  var gk={},d2;
  for(d2=1;d2<=S.per;d2++)gk[d2]=(S.gk&&K.length>1)?K[(d2-1)%K.length].id:K[0].id;
  var A=am(),T={};
  P.forEach(function(p){T[p.id]=cl(isA(p)?(A[p.id]||0):+p.target,0,e)});
  var to=SO*e,su=0;
  outs.forEach(function(i){su+=T[i]});
  if(su>.01)outs.forEach(function(i){T[i]=Math.min(e,T[i]*to/su)});
  else outs.forEach(function(i){T[i]=Math.min(e,to/Math.max(1,outs.length))});
  function times(st){
    var o={0:1},m=e/4;
    for(var k=1;k<=S.per;k++){
      var a=(k-1)*S.mpp,b=k*S.mpp;
      if(b<e&&b>=m-.001)o[b]=1;
      if(st>0)for(var t=a+st;t<b-.001;t+=st)if(t<e&&t>=m-.001)o[t]=1;
    }
    return Object.keys(o).map(Number).sort(function(x,y){return x-y});
  }
  var best=null;
  [S.sub,10].forEach(function(st,gi){
    if(st<=0)return;
    var ts=times(st);
    if(!ts.length)return;
    if(best&&best.ts.join('|')===ts.join('|'))return;
    for(var k=0;k<(gi?1:2);k++){
      var r=run(ts,st);
      if(!best||r.score<best.score)best=r;
    }
  });
  if(!best)best=run(times(0),0);
  return best;
  function run(ts,step){
    var B=[],i;
    for(i=0;i<ts.length;i++){var a=ts[i],b=(i+1<ts.length?ts[i+1]:e);if(b>a)B.push({t0:a,t1:b,len:b-a,per:Math.floor(a/S.mpp)+1});}
    if(!B.length)B.push({t0:0,t1:e,len:e,per:1});
    var nB=B.length,pl={},ON=[],SL=[];
    outs.forEach(function(x){pl[x]=0});
    function fitB(b,set){
      var a=blk(N),g=gk[B[b].per],u={};
      if(g!=null){a[0]=g;u[g]=1}
      var ord=[],k;
      for(k=1;k<N;k++)ord.push(k);
      function cn(pos){var c=0;set.forEach(function(id){if(!u[id]&&FS(ply(id),pos)>=3)c++});return c}
      ord.sort(function(x,y){return cn(F.s[x].p)-cn(F.s[y].p)});
      ord.forEach(function(si){
        var bi=-1,bs=-9,m;
        for(m=0;m<set.length;m++){
          if(u[set[m]])continue;
          var v=FS(ply(set[m]),F.s[si].p);
          if(v>bs){bs=v;bi=m}
        }
        if(bi>=0){a[si]=set[bi];u[set[bi]]=1}
      });
      for(var r=0;r<8;r++){
        var ch=false;
        for(var x=1;x<N;x++)for(var y=x+1;y<N;y++){
          var X=a[x],Y=a[y];
          if(!X||!Y)continue;
          if(FS(ply(X),F.s[y].p)+FS(ply(Y),F.s[x].p)>FS(ply(X),F.s[x].p)+FS(ply(Y),F.s[y].p)+1.5){a[x]=Y;a[y]=X;ch=true}
        }
        if(!ch)break;
      }
      return a;
    }
    for(var b=0;b<nB;b++){
      var lb=B[b].len,g2=gk[B[b].per],u2={},set=[];
      if(g2!=null)u2[g2]=1;
      function nd(id){return Math.max(0,T[id]-pl[id])/lb}
      var ord2=[],s2;
      for(s2=1;s2<N;s2++)ord2.push(s2);
      function cn2(pos){var c=0;outs.forEach(function(id){if(!u2[id]&&FS(ply(id),pos)>=3)c++});return c}
      ord2.sort(function(x,y){return cn2(F.s[x].p)-cn2(F.s[y].p)});
      ord2.forEach(function(si){
        var free=outs.filter(function(id){return !u2[id]});
        if(!free.length)return;
        var mx=0;
        free.forEach(function(id){var v=nd(id);if(v>mx)mx=v});
        var el=free.filter(function(id){return nd(id)>=mx-1});
        if(!el.length)el=free.filter(function(id){return T[id]-pl[id]>.01});
        if(!el.length)el=free;
        var bp=null,bs=-9;
        el.forEach(function(id){
          var v=FS(ply(id),F.s[si].p)*4+Math.min(nd(id),2.5)*1.2+(b>0&&ON[b-1].indexOf(id)>=0?1.5:0);
          if(v>bs){bs=v;bp=id}
        });
        if(bp!=null){u2[bp]=1;set.push(bp);pl[bp]+=lb}
      });
      ON[b]=set;
      SL[b]=fitB(b,set);
    }
    for(var it=0;it<200;it++){
      var bd=-.05,bi=-1,bx=-1,bq=null,b3,x3,y3;
      for(b3=0;b3<nB;b3++){
        var l3=B[b3].len;
        for(x3=0;x3<ON[b3].length;x3++){
          var p3=ON[b3][x3];
          var dp=Math.abs(pl[p3]-l3-T[p3])-Math.abs(pl[p3]-T[p3]);
          if(dp>=0)continue;
          for(y3=0;y3<outs.length;y3++){
            var q3=outs[y3];
            if(ON[b3].indexOf(q3)>=0)continue;
            var dq=Math.abs(pl[q3]+l3-T[q3])-Math.abs(pl[q3]-T[q3]);
            if(dp+dq>=bd)continue;
            bd=dp+dq;bi=b3;bx=x3;bq=q3;
          }
        }
      }
      if(bq==null)break;
      var o1=ON[bi][bx];
      ON[bi][bx]=bq;pl[o1]-=B[bi].len;pl[bq]+=B[bi].len;
    }
    for(var b4=0;b4<nB;b4++)SL[b4]=fitB(b4,ON[b4]);
    for(var r4=0;r4<6;r4++){
      var ch4=false,b5,at,x5,y5;
      for(b5=0;b5<nB;b5++){
        var l5=B[b5].len;
        for(at=0;at<4;at++){
          var a5=SL[b5],bd5=-.02,bp5=null,bq5=null;
          for(x5=1;x5<N;x5++){
            var p5=a5[x5];
            if(!p5)continue;
            var e5=PN(ply(p5),F.s[x5].p,l5);
            for(y5=0;y5<outs.length;y5++){
              var q5=outs[y5];
              if(ON[b5].indexOf(q5)>=0)continue;
              var dpe=PN(ply(q5),F.s[x5].p,l5)-e5;
              if(dpe>=-.2)continue;
              var dmi=Math.abs(pl[p5]-l5-T[p5])-Math.abs(pl[p5]-T[p5]);
              dmi+=Math.abs(pl[q5]+l5-T[q5])-Math.abs(pl[q5]-T[q5]);
              if(dmi*3+dpe<bd5){bd5=dmi*3+dpe;bp5=p5;bq5=q5}
            }
          }
          if(bp5==null)break;
          ON[b5][ON[b5].indexOf(bp5)]=bq5;
          pl[bp5]-=l5;pl[bq5]+=l5;
          SL[b5]=fitB(b5,ON[b5]);
          ch4=true;
        }
      }
      if(!ch4)break;
    }
    var er=0,oo=0,un=0,pn=0,sn=[],b6;
    outs.forEach(function(x){er+=Math.abs(pl[x]-T[x])});
    for(b6=0;b6<nB;b6++){
      var l6=B[b6].len;
      for(var s6=1;s6<N;s6++){
        var o6=SL[b6][s6];
        if(!o6){un++;continue}
        pn+=PN(ply(o6),F.s[s6].p,l6);
        if(OOP(ply(o6),F.s[s6].p))oo++;
      }
      sn.push({id:uid++,t:B[b6].t0,assign:SL[b6].slice()});
    }
    var w=0;
    outs.forEach(function(x){w=Math.max(w,Math.abs(pl[x]-T[x]))});
    return {snaps:sn,ts:ts,step:step,score:er*2.5+pn+oo*18+nB*.6+un*60,worst:w,oo:oo,nb:nB};
  }
}
function esc(s){return String(s==null?'':s).split('&').join('&amp;').split('<').join('&lt;')}
function msg(t){d('bar').textContent=t;d('bar').className='bar';}
function go(p){
  var a=['sq','pit','pl'],i;
  if(a.indexOf(p)<0)p='sq';
  S.page=p;
  for(i=0;i<a.length;i++){var x=d('pg-'+a[i]);if(x)x.className='pg'+(a[i]===p?' on':'');}
  var b=d('tb').getElementsByTagName('button');
  for(i=0;i<b.length;i++)b[i].className=b[i].getAttribute('data-p')===p?'on':'';
}
function cfg(){
  var h='',i;
  h+='<label>Side <select id="cSide">';
  for(i=5;i<=11;i++)h+='<option'+(i===S.side?' selected':'')+'>'+i+'</option>';
  h+='</select></label>';
  h+='<label>Formation <select id="cForm">';
  shapes().forEach(function(f,k){h+='<option value="'+k+'"'+(k===S.form?' selected':'')+'>'+f[0]+'</option>'});
  h+='</select></label>';
  h+='<label>Periods <select id="cPer">';
  for(i=1;i<=6;i++)h+='<option'+(i===S.per?' selected':'')+'>'+i+'</option>';
  h+='</select></label>';
  h+='<label>Min/period <select id="cMpp">';
  [5,10,15,20,25,30,40].forEach(function(v){h+='<option'+(v===S.mpp?' selected':'')+'>'+v+'</option>'});
  h+='</select></label>';
  h+='<label>Sub every <select id="cSub">';
  [0,5,10,15,20,25,30].forEach(function(v){h+='<option'+(v===S.sub?' selected':'')+'>'+v+'</option>'});
  h+='</select></label>';
  h+='<label><input type="checkbox" id="cGk"'+(S.gk?' checked':'')+'> GK rotation</label>';
  d('cfgRow').innerHTML=h;
  d('pg-'+S.page+'').className='pg on';
}
function sq(){
  var has=S.players.length>0;
  d('sqBox').style.display=has?'':'none';
  var tb=d('pT').getElementsByTagName('tbody')[0];
  if(!has){tb.innerHTML='';bud();return}
  var c=calc(),A=am(),kid=keep().map(function(k){return k.id}),h='';
  S.players.forEach(function(p){
    var m=c.mn[p.id]||0,v=A[p.id]||0,au=isA(p);
    h+='<tr data-id="'+p.id+'"><td><input class="cell" style="width:34px" data-f="num" value="'+esc(p.num)+'"></td>';
    h+='<td><input class="cell" data-f="name" value="'+esc(p.name)+'">'+(kid.indexOf(p.id)>=0?' GK':'')+'</td>';
    h+='<td><input class="cell" data-f="prefs" value="'+p.prefs.join('/')+'" placeholder="GK/LB"></td>';
    h+='<td><button data-st="-" data-id="'+p.id+'">-</button> <input class="cell" style="width:48px;display:inline-block" data-f="target" data-id="'+p.id+'" value="'+(au?'':p.target)+'" placeholder="auto '+v+'"> <button data-st="+" data-id="'+p.id+'">+</button>';
    if(!au)h+=' <button data-au="'+p.id+'">auto</button>';
    h+='</td><td><button data-del="'+p.id+'">x</button></td></tr>';
  });
  tb.innerHTML=h;
  bud();
}
function bud(){
  var e=E(),F=SH(),A=am(),sum=0,set=0,total=F.s.length*e;
  S.players.forEach(function(p){if(isA(p))sum+=A[p.id]||0;else{sum+=+p.target;set++}});
  var df=sum-total,f=d('bF');
  f.style.width=Math.min(100,Math.abs(sum/total)*100/1.4)+'%';
  f.className='bf'+(df>5?' ov':(df<-5?' un':''));
  d('bud').textContent='Wants '+Math.round(sum)+' of '+total+' min available ('+set+' set, '+(S.players.length-set)+' auto) - '+
    (df>5?(Math.round(df)+' min OVER'):(df<-5?(Math.round(-df)+' min UNDER'):'adds up exactly'));
  d('prompt').innerHTML=(sum>=total-10)?'Minutes are set. <b>Time to plan the match.</b>':'You can still adjust minutes &mdash; or just plan the match now.';
}
function pit(){
  var F=SH(),ss=srt(),a=act()||{t:0,assign:blk(F.s.length)},c=calc(),el=d('pitch');
  var i=ss.indexOf(act()),pv=i>0?ss[i-1]:null,h='';
  var sets=pv?subSets(pv,a):{subs:[],shuf:[]};
  var glow={};
  sets.subs.forEach(function(sb,k){glow[sb.si]=COLS[k%COLS.length]});
  F.s.forEach(function(sl,si){
    var id=a.assign[si],p=id?ply(id):null,col=glow[si];
    h+='<div class="sl" data-si="'+si+'" style="left:'+sl.x+'%;top:'+sl.y+'%"><b>'+sl.p+'</b>';
    if(p){
      var m=c.mn[id]||0,cc=isA(p)?'':(m>p.target?'over':(m<p.target?'under':''));
      h+='<div class="tk '+FM[sl.p]+'" data-pid="'+id+'" data-si="'+si+'" style="'+(col?'box-shadow:0 0 0 5px '+col+',0 0 22px 7px '+col+';':'')+'">'+esc(p.num)+'</div>';
      h+='<i>'+esc(p.name)+'</i>';
      if(col){
        var sb=null;
        sets.subs.forEach(function(z){if(z.si===si)sb=z});
        if(sb)h+='<div class="fr" style="background:'+col+'">on for '+(sb.outP?esc(sb.outP.name):'nobody')+'</div>';
      }
      h+='<u class="'+cc+'">'+m+'</u>';
    }else h+='<div class="em">+</div>';
    h+='</div>';
  });
  el.innerHTML=h;
  var sh='';
  sets.subs.forEach(function(sb,k){
    var col=COLS[k%COLS.length];
    sh+='<div style="border-left:4px solid '+col+';padding-left:6px;margin-top:4px"><span class="sbp">IN #'+esc(sb.inP.num)+' '+esc(sb.inP.name)+'</span> <span style="color:#93a4bf">for</span> <span class="sbo">'+(sb.outP?'#'+esc(sb.outP.num)+' '+esc(sb.outP.name):'nobody coming off')+'</span> <span style="color:#93a4bf">('+sb.pos+')</span></div>';
  });
  if(sets.shuf.length&&!sets.subs.length){
    sh+='<div class="shl">Position shuffle only: '+sets.shuf.map(function(z){return (z.inP?esc(z.inP.name):'-')+' to '+z.pos}).join(', ')+'</div>';
  }
  d('subs').innerHTML=sh;
  var bh='';
  ss.forEach(function(s,k){
    var nx=ss[k+1],l=(nx?nx.t:E())-s.t;
    bh+='<button class="'+(s.id===S.aid?'on':'')+'" data-id="'+s.id+'">'+s.t+'<br><small>'+l+' min</small></button>';
  });
  d('bk').innerHTML=bh;
  var on={};
  if(a)a.assign.forEach(function(v){if(v)on[v]=1});
  d('bench').innerHTML=S.players.filter(function(p){return !on[p.id]}).map(function(p){
    return '<div class="bt" data-pid="'+p.id+'">#'+esc(p.num)+' '+esc(p.name)+' <span style="color:#93a4bf">('+(p.prefs.join('/')||'any')+')</span></div>';
  }).join('')||'<span style="font-size:12px;color:#93a4bf">Everyone is on the pitch.</span>';
}
function tl(){
  var ss=srt(),F=SH(),h='';
  for(var i=0;i<ss.length;i++){
    var s=ss[i],pv=i?ss[i-1]:null,lines=[];
    if(!pv)lines.push('Kick-off line-up');
    else{
      var sets=subSets(pv,s);
      sets.subs.forEach(function(sb,k){
        var col=COLS[k%COLS.length];
        lines.push('<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+col+';margin-right:4px"></span>'+
          '<span class="sbo">OUT '+(sb.outP?('#'+esc(sb.outP.num)+' '+esc(sb.outP.name)):'nobody')+'</span> <span class="sbp">IN #'+esc(sb.inP.num)+' '+esc(sb.inP.name)+' ('+sb.pos+')</span>');
      });
      if(sets.shuf.length&&!sets.subs.length)lines.push('Position shuffle only');
      if(!sets.subs.length&&!sets.shuf.length)lines.push('No change');
    }
    h+='<div class="cr'+(s.id===S.aid?' on':'')+'"><b>'+s.t+' min</b> <span style="color:#93a4bf">'+(i?'sub':'kick-off')+'</span><div>'+lines.join('<br>')+'</div></div>';
  }
  d('tl').innerHTML=h||'<div style="font-size:12px;color:#93a4bf">No plan yet.</div>';
}
function pos(){
  var c=calc(),F=SH(),bs=bl(),h='';
  h='<tr><th>#</th><th>Player</th><th>Mins</th>'+(bs.length?bs.map(function(b){return '<th>'+b.t0+'-'+b.t1+'</th>'}).join(''):'<th>Where</th>')+'</tr>';
  S.players.forEach(function(p){
    var m=c.mn[p.id]||0,w=wnt(p),df=m-w;
    h+='<tr><td>'+esc(p.num)+'</td><td>'+esc(p.name)+'</td><td>'+m+(df>2?' (+'+Math.round(df)+')':(df<-2?' ('+Math.round(df)+')':''))+'</td>';
    if(bs.length){
      bs.forEach(function(b){
        var i=b.sn.assign.indexOf(p.id);
        if(i<0){h+='<td><span class="pc b">bench</span></td>';return}
        var ps=F.s[i].p;
        h+='<td><span class="pc"'+(OOP(p,ps)?' style="outline:1px solid #ef4444"':'')+'>'+ps+'</span></td>';
      });
    }else h+='<td>-</td>';
    h+='</tr>';
  });
  d('posT').innerHTML=h;
}
function ck(){
  var c=calc(),out=[],any=0;
  srt().forEach(function(s){s.assign.forEach(function(v){if(v)any++})});
  if(!any){d('ck').innerHTML='<div>No plan yet - press Auto plan.</div>';return}
  S.players.forEach(function(p){
    var m=c.mn[p.id]||0,w=wnt(p),df=m-w;
    if(df>3)out.push(['warn','#'+p.num+' '+p.name+' is '+Math.round(df)+' min OVER ('+m+' vs '+w+')']);
    else if(df<-3)out.push(['warn','#'+p.num+' '+p.name+' is '+Math.round(-df)+' min UNDER ('+m+' vs '+w+')']);
  });
  S.players.forEach(function(p){
    if(!p.prefs.length)return;
    var bp=c.bp[p.id]||{};
    Object.keys(bp).forEach(function(ps){
      var i=p.prefs.indexOf(ps);
      if(i<0&&OOP(p,ps))out.push(['bad','#'+p.num+' '+p.name+' OUT OF POSITION - '+Math.round(bp[ps])+' min at '+ps]);
      else if(i>=2)out.push(['','#'+p.num+' '+p.name+' on choice '+(i+1)+' - '+Math.round(bp[ps])+' min at '+ps]);
    });
  });
  if(!out.length)out.push(['','Clean - minutes on target, nobody out of position']);
  d('ck').innerHTML=out.slice(0,14).map(function(o){return '<div class="'+o[0]+'">'+o[1]+'</div>'}).join('');
}
function all(){sq();pit();tl();pos();ck();}
function addP(n,num,pr,tg){var p={id:uid++,num:(num!=null?num:S.players.length+1),name:n||'Player',prefs:pr||[],target:(tg==null?null:tg)};S.players.push(p);return p}
function carry(ch){var ss=srt(),i=ss.indexOf(act()),j,k;for(j=i+1;j<ss.length;j++)for(k=0;k<ch.length;k++)ss[j].assign[ch[k]]=ss[i].assign[ch[k]];}
function note(p){var m=calc().mn[p.id]||0,w=wnt(p),df=m-w;return m+' min'+(df>2?' ('+Math.round(df)+' over)':(df<-2?' ('+Math.round(-df)+' under)':''));}
function put(si,pid){
  var s=act();
  if(!s)return;
  var old=s.assign[si],vac=-1,bits=[],i;
  for(i=0;i<s.assign.length;i++)if(s.assign[i]===pid&&i!==si)vac=i;
  s.assign[si]=pid;
  if(vac>=0)s.assign[vac]=old;
  carry([si].concat(vac>=0?[vac]:[]));
  if(pid){var p=ply(pid);if(p)bits.push('#'+p.num+' '+p.name+' '+note(p))}
  if(old&&old!==pid){var q=ply(old);if(q)bits.push('#'+q.num+' '+q.name+' '+note(q))}
  all();
  msg(bits.join(' / '));
}
function toBn(si){var s=act();if(!s)return;var id=s.assign[si];if(!id)return;s.assign[si]=null;carry([si]);var p=ply(id);all();if(p)msg('#'+p.num+' '+p.name+' off - '+note(p));}
function swapAB(a,b){var s=act();if(!s)return;var t=s.assign[a];s.assign[a]=s.assign[b];s.assign[b]=t;carry([a,b]);all()}
window.addEventListener('pointermove',function(e){
  if(!drag)return;
  if(Math.abs(e.clientX-drag.x)>6||Math.abs(e.clientY-drag.y)>6)drag.mv=true;
  if(gh){gh.style.left=e.clientX+'px';gh.style.top=e.clientY+'px'}
  if(drag.mv){
    var a=document.querySelectorAll('.sl.ov,.bn.ov'),i;
    for(i=0;i<a.length;i++)a[i].className=a[i].className.split(' ov').join('');
    var el=document.elementFromPoint(e.clientX,e.clientY);
    var t=el&&el.closest?el.closest('.sl,.bn'):null;
    if(t)t.className+=' ov';
  }
});
window.addEventListener('pointerup',function(e){
  if(!drag)return;
  var g=drag;drag=null;
  if(gh){document.body.removeChild(gh);gh=null}
  var a=document.querySelectorAll('.sl.ov,.bn.ov'),i;
  for(i=0;i<a.length;i++)a[i].className=a[i].className.split(' ov').join('');
  if(!g.mv){
    if(!sel)sel={k:g.k,pid:g.pid,si:g.si};
    else if(sel.pid===g.pid)sel=null;
    else if(g.k==='sl'){put(g.si,sel.pid);sel=null}
    else if(g.k==='bn'&&sel.k==='sl'){toBn(sel.si);sel=null}
    else sel={k:g.k,pid:g.pid,si:g.si};
    all();return;
  }
  var el=document.elementFromPoint(e.clientX,e.clientY);
  var t=el&&el.closest?el.closest('.sl,.bn'):null;
  if(!t){all();return}
  if(t.className.indexOf('bn')>=0){if(g.k==='sl')toBn(g.si);sel=null;all();return}
  var si=parseInt(t.getAttribute('data-si'),10);
  if(g.k==='sl'){if(g.si!==si)swapAB(g.si,si)}else put(si,g.pid);
  sel=null;
});
document.addEventListener('pointerdown',function(e){
  var t=e.target.closest?e.target.closest('.tk,.bt'):null;
  if(!t)return;
  e.preventDefault();
  var pid=parseInt(t.getAttribute('data-pid'),10),p=ply(pid);
  if(!p)return;
  var sv=t.getAttribute('data-si');
  drag={k:sv?'sl':'bn',pid:pid,si:sv?parseInt(sv,10):null,x:e.clientX,y:e.clientY,mv:false};
  gh=document.createElement('div');
  gh.className='gh';
  gh.textContent='#'+p.num+' '+p.name;
  gh.style.left=e.clientX+'px';
  gh.style.top=e.clientY+'px';
  document.body.appendChild(gh);
});
d('tb').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;go(b.getAttribute('data-p'))});
d('bImp').addEventListener('click',function(){
  try{
    var v=d('ap').value||'',lines=v.split('\n').filter(function(s){return s.replace(/\s/g,'')!==''});
    if(!lines.length){msg('Paste some rows first');return}
    var n=0;
    lines.forEach(function(line){
      var parts=line.split('\t').join(',').split(';').join(',').split(',').map(function(s){return s.trim()}).filter(function(s){return s!==''});
      if(!parts.length)return;
      var num=null,name=null,pr=[],tg=null,idx=0,i,k;
      if(/^[0-9]{1,3}$/.test(parts[0])&&parts.length>1){num=parseInt(parts[0],10);idx=1}
      name=parts[idx]||'Player';idx++;
      for(i=idx;i<parts.length;i++){
        var w=parts[i];
        if(/^[0-9]{1,3}$/.test(w)){tg=parseInt(w,10);continue}
        var q=pp(w);
        for(k=0;k<q.length;k++)if(pr.indexOf(q[k])<0)pr.push(q[k]);
      }
      if(num==null)num=S.players.length+1;
      addP(name,num,pr,tg);n++;
    });
    d('ap').value='';
    if(!S.snaps.length)S.snaps=[{id:uid++,t:0,assign:blk(SH().s.length)}];
    if(!S.aid)S.aid=S.snaps[0].id;
    all();
    msg(n+' players imported - adjust minutes, then press Auto plan');
  }catch(err){bar('Import failed: '+err.message,true)}
});
d('bAdd').addEventListener('click',function(){addP('New player',S.players.length+1,[],null);all()});
d('bClr').addEventListener('click',function(){S.players=[];S.snaps=[{id:uid++,t:0,assign:blk(SH().s.length)}];S.aid=S.snaps[0].id;sel=null;all();go('sq')});
d('bGo').addEventListener('click',function(){
  try{
    if(!S.players.length){msg('Add players first');return}
    var r=planner();
    S.snaps=r.snaps;
    S.aid=r.snaps[0].id;
    go('pit');all();
    msg('Plan: '+r.nb+' blocks of ~'+r.step+' min, biggest miss '+Math.round(r.worst)+' min, out of position: '+r.oo);
  }catch(err){bar('Auto plan failed: '+err.message,true)}
});
d('bk').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;S.aid=parseInt(b.getAttribute('data-id'),10);sel=null;all()});
d('pT').addEventListener('click',function(e){
  var x=e.target.closest('button'),id,p,A,e2,a;
  if(!x)return;
  if(x.getAttribute('data-del')){id=parseInt(x.getAttribute('data-del'),10);S.players=S.players.filter(function(q){return q.id!==id});S.snaps.forEach(function(s){s.assign=s.assign.map(function(v){return v===id?null:v})});all();return}
  if(x.getAttribute('data-au')){p=ply(parseInt(x.getAttribute('data-au'),10));if(p){p.target=null;all()}return}
  if(x.getAttribute('data-st')){
    id=parseInt(x.getAttribute('data-id'),10);
    p=ply(id);
    if(!p)return;
    A=am();e2=E();a=A[id]||0;
    if(x.getAttribute('data-st')==='+')p.target=isA(p)?cl(a+10,0,e2):cl(Math.round(+p.target)+10,0,e2);
    else p.target=isA(p)?cl(a-10,0,e2):cl(Math.round(+p.target)-10,0,e2);
    all();
  }
});
d('pT').addEventListener('input',function(e){
  var inp=e.target.closest('input');
  if(!inp)return;
  var tr=inp.closest('tr');
  if(!tr)return;
  var p=ply(parseInt(tr.getAttribute('data-id'),10));
  if(!p)return;
  var f=inp.getAttribute('data-f');
  if(f==='num')p.num=inp.value.replace(/[^0-9]/g,'').slice(0,3);
  else if(f==='name')p.name=inp.value;
  else if(f==='prefs')p.prefs=pp(inp.value);
  else if(f==='target')p.target=inp.value.trim()===''?null:cl(parseFloat(inp.value)||0,0,E());
  bud();
});
d('cfgRow').addEventListener('change',function(e){
  var id=e.target.id,v=parseInt(e.target.value,10);
  if(id==='cSide'){S.side=cl(v,5,11);S.form=0}
  else if(id==='cForm')S.form=parseInt(e.target.value,10)||0;
  else if(id==='cPer')S.per=cl(v,1,6);
  else if(id==='cMpp')S.mpp=cl(v,4,45);
  else if(id==='cSub')S.sub=cl(v,0,30);
  else if(id==='cGk')S.gk=e.target.checked;
  if(id==='cSide'||id==='cForm'||id==='cPer'||id==='cMpp'){
    var e2=E();
    S.snaps=srt().filter(function(s){return s.t<e2});
    if(!S.snaps.length)S.snaps=[{id:uid++,t:0,assign:blk(SH().s.length)}];
    var ok=false;
    for(var i=0;i<S.snaps.length;i++)if(S.snaps[i].id===S.aid)ok=true;
    if(!ok)S.aid=srt()[0].id;
  }
  cfg();all();
});
try{
  S.snaps=[{id:uid++,t:0,assign:blk(SH().s.length)}];
  S.aid=S.snaps[0].id;
  cfg();go('sq');all();
  bar('Ready - paste your squad to begin',false);
}catch(err){
  bar('Start-up problem: '+err.message,true);
}
</script>

var b=document.getElementById('bar');
if(b&&b.textContent.indexOf('Ready')<0)b.textContent+=' | file intact, script failed';
</script>
